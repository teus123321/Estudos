<body style="background-color: #FFC0CB;">
    <div>
        <div>
            <h1 style="text-align: center;">Atividade poema </h1>
        </div>

        <div>
            <h2 style="text-align:center;">
                Entre o silêncio e o vento
            </h2>
        </div>
        <div>
            <div style="text-align: left; padding-left: 200px;">
                <p><b>No sopro leve da tarde,</b></p>
                <p><b>o tempo se deita na sombra,</b></p>
            </div>

            <div style="text-align: right; padding-right: 200px;">
                <p><b>e as folhas dançam segredos</b></p>
                <p><b>que só o coração entende.</b></p>
            </div>

            <div style="text-align: left; padding-left: 200px;">
                <p><b>Caminho por ruas vazias,</b></p>
                <p><b>onde passos ecoam memórias,</b></p>
                <p><b>e descubro que a saudade</b></p>
            </div>

            <div style="text-align: right; padding-right: 200px;">
                <p><b>é apenas amor que não dorme.</b></p>
            </div>

        </div>
    </div>

</body>
