<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>receita</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3565/3565418.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="img.css">
</head>

<body>
    <div class="container">
        <div>
            <img src="https://media.istockphoto.com/id/803095110/pt/vetorial/hand-drawn-piece-of-layered-chocolate-cake-with-icing-shavings.jpg?s=612x612&w=0&k=20&c=_QtH5KpQWnnmiuFXCDRDuzV-PAdsgrMdioyoWrRptls="
                alt="receita" id="icon">
        </div>
        <div class="detalhes">
            <h1>Bem vindo ao site de receita !!</h1>
            <p>abaixo estão os <b>cards</b> para você clicar e ver passo a passo das receitas</p>
        </div>
        <div class="cards-wrapper">
            <!-- CARD 1 -->
            <div class="card-container">
                <!-- Esta é a peça que realmente gira. Guarde bem este ID! -->
                <div class="card-inner" id="inner-card-1">

                    <!-- FRENTE: O que o usuário vê primeiro -->
                    <div class="card-front">
                        <h3>Ingredientes</h3>
                        <p>Clique para ver a lista ➔</p>
                    </div>

                    <!-- VERSO: A sua lista original -->
                    <div class="card-back">
                        <h3>Ingredientes</h3>
                        <ul>
                            <li>Primeiro leite</li>
                            <li>Ovo</li>
                            <li>Açúcar</li>
                            <li>Chocolate</li>
                        </ul>
                    </div>

                </div>
            </div>

            <!-- CARD 2 -->
            <div class="card-container">
                <div class="card-inner" id="inner-card-2">

                    <div class="card-front">
                        <h3>Preparo</h3>
                        <p>Clique para revelar ➔</p>
                    </div>

                    <div class="card-back">
                        <h3>Preparo</h3>
                        <ul>
                            <li>Forno por 1 dia</li>
                            <li>Só comer</li>
                        </ul>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>

</html>
