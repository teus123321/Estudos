<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entrada</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div>

                </div>
                
                <div class="welcome">
                    <h1>Bem-vindo(a) ao nosso site!</h1>
                    <p id="text-entrada">Estamos felizes em tê-lo(a) aqui. Explore nosso conteúdo e aproveite sua

            </div>

            <div class="label">

                <input type="password" id="password" name="password" placeholder="Sua senha">
            </div>
        </div>

        <div class="navegar">
            <a href="index.html" id="button">Clique aqui !</a>
